<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Touri — Inicio</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="tailwind-config.js"></script>
</head>
<body class="min-h-screen flex items-center justify-center p-6">
  <div class="w-full max-w-[390px] bg-white rounded-[36px] p-2.5 shadow-2xl">
    <div class="relative w-full overflow-hidden rounded-[28px]" style="aspect-ratio: 9 / 16; max-height: 720px;">
      <!-- ============ SCREEN 1: HOME ============ -->
      <section id="screen-home" class="screen active flex-col w-full h-full bg-touri-cream font-sans">
        <div class="flex items-center justify-between px-5 pt-6">
          <span class="font-display text-2xl tracking-tight text-touri-green">TOURI</span>
          <div class="relative">
             <button id="lang-btn" class="flex items-center gap-1.5 rounded-full bg-touri-dark text-touri-cream text-xs px-3 py-1.5" onclick="toggleLangMenu()">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
                <span id="current-lang-text">Español</span>
             </button>
             <div id="lang-menu" class="absolute right-0 mt-2 w-32 bg-white rounded-lg shadow-lg overflow-hidden hidden z-50">
               <button class="w-full text-left px-4 py-2 text-sm text-touri-dark hover:bg-touri-cream" onclick="selectLang('es')">Español</button>
               <button class="w-full text-left px-4 py-2 text-sm text-touri-dark hover:bg-touri-cream" onclick="selectLang('en')">English</button>
               <button class="w-full text-left px-4 py-2 text-sm text-touri-dark hover:bg-touri-cream" onclick="selectLang('fr')">Français</button>
             </div>
          </div>
        </div>
        <p data-i18n="home.subtitle" class="px-5 mt-0.5 mb-5 text-sm text-touri-dark/60">Tu guía local, sin instalar nada.</p>

        <div class="px-5 flex-1 overflow-hidden flex flex-col">
          <p data-i18n="home.tours" class="text-xs font-bold tracking-wide uppercase text-touri-dark mb-2.5">Tours disponibles</p>

          <div id="tours-container" class="flex-1 overflow-y-auto pb-4">
             <!-- Tours will be injected here -->
          </div>
        </div>

        <div class="px-5 py-5 flex justify-center gap-5 border-t border-touri-dark/10 text-[11px] text-touri-dark/60">
          <span data-i18n="home.how">Cómo funciona</span><span data-i18n="home.about">Sobre Touri</span><span data-i18n="home.contact">Contacto</span>
        </div>
      </section>
    </div>
  </div>

  <script src="i18n.js"></script>
  <script src="tour-data.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // 1. Language logic
      const currentLang = getLang();
      updateLangUI(currentLang);
      
      // 2. Load tours
      const tourIds = ['vitoria-casco-medieval']; 
      const toursContainer = document.getElementById('tours-container');
      
      for (const id of tourIds) {
        const tour = await TourData.loadTour(id);
        if (tour) {
          const meta = TourData.getMeta(getLang());
          
          let imgUrl = 'https://images.unsplash.com/photo-1558642084-fd07fae5282e?w=780&q=80'; 
          if(tour.stops && tour.stops[0] && tour.stops[0].wiki_title) {
            const wikiImg = await TourData.fetchWikiImage(tour.stops[0].wiki_title);
            if(wikiImg) imgUrl = wikiImg;
          }

          const button = document.createElement('button');
          button.className = "w-full text-left relative rounded-[18px] overflow-hidden h-[150px] mb-3.5 block";
          button.onclick = () => { window.location.href = `tour-detail.html?id=${id}`; };
          
          button.innerHTML = `
            <img src="${imgUrl}" class="absolute inset-0 w-full h-full object-cover" alt="" />
            <div class="absolute inset-0 bg-gradient-to-t from-touri-dark/90 via-touri-dark/10 to-transparent"></div>
            <div class="absolute bottom-3 left-3.5 right-3.5">
              <p class="font-display text-xl uppercase text-touri-cream m-0">${meta.name || meta.city}</p>
              <p class="text-xs text-touri-yellow mt-0.5">${tour.stops.length} ${t('explore.stops')} · ${Math.round(tour.stats.duration_min/60)}h · ${t('home.free')}</p>
            </div>
          `;
          toursContainer.appendChild(button);
        }
      }

      // 3. Upcoming placeholder
      const upcomingDiv = document.createElement('div');
      upcomingDiv.className = "relative rounded-[18px] overflow-hidden h-[100px] opacity-55 mt-2";
      upcomingDiv.innerHTML = `
        <img src="https://images.unsplash.com/photo-1502602898657-3e91760cbb34?w=780&q=80" class="absolute inset-0 w-full h-full object-cover grayscale-[40%]" alt="" />
        <div class="absolute inset-0 bg-touri-dark/55"></div>
        <div class="absolute bottom-2.5 left-3.5">
          <p class="font-display text-base uppercase text-touri-cream m-0">${t('city_paris')}</p>
          <p class="text-[11px] text-touri-cream/75 mt-0.5">${t('explore.upcoming')}</p>
        </div>
      `;
      toursContainer.appendChild(upcomingDiv);

      // 4. Malta upcoming placeholder
      const maltaDiv = document.createElement('div');
      maltaDiv.className = "relative rounded-[18px] overflow-hidden h-[100px] opacity-55 mt-3 mb-2";
      maltaDiv.innerHTML = `
        <img src="https://images.unsplash.com/photo-1549429188-724bc27ab5ce?w=780&q=80" class="absolute inset-0 w-full h-full object-cover grayscale-[40%]" alt="" />
        <div class="absolute inset-0 bg-touri-dark/55"></div>
        <div class="absolute bottom-2.5 left-3.5">
          <p class="font-display text-base uppercase text-touri-cream m-0">${t('city_malta')}</p>
          <p class="text-[11px] text-touri-cream/75 mt-0.5">${t('explore.upcoming')}</p>
        </div>
      `;
      toursContainer.appendChild(maltaDiv);
      
      applyTranslations();
    });

    function toggleLangMenu() {
      const menu = document.getElementById('lang-menu');
      menu.classList.toggle('hidden');
    }

    function selectLang(lang) {
      setLanguage(lang);
      updateLangUI(lang);
      toggleLangMenu();
      window.location.reload(); 
    }

    function updateLangUI(lang) {
      const texts = { 'es': 'Español', 'en': 'English', 'fr': 'Français' };
      document.getElementById('current-lang-text').innerText = texts[lang] || 'Español';
    }

    document.addEventListener('click', (e) => {
      const btn = document.getElementById('lang-btn');
      const menu = document.getElementById('lang-menu');
      if(btn && menu && !btn.contains(e.target) && !menu.contains(e.target)) {
        menu.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
