<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#232321">
  <title>Touri — En Ruta</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="tailwind-config.js"></script>
  <style>
    /* Leaflet dark theme tweaks */
    #map { background: #1a1a18; }
    .leaflet-control-attribution { display: none; }
    .leaflet-container .leaflet-control-zoom a { background: rgba(35,35,33,0.85); color: #EFE1CD; border: none; }
    
    /* GPS Status Toast */
    .gps-status {
      position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
      background: rgba(35,35,33,0.9); color: #EFE1CD; font-size: 12px;
      padding: 6px 16px; border-radius: 100px; display: flex; align-items: center; gap: 6px;
      z-index: 9999; opacity: 0; pointer-events: none; transition: opacity 0.3s;
    }
    .gps-status.show { opacity: 1; }
    .toast {
      position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%) translateY(100px);
      background: #3D3B33; color: #EFE1CD; padding: 14px 24px; border-radius: 14px;
      font-size: 14px; z-index: 9999; opacity: 0; transition: all 0.3s;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 bg-[#EDEDED]">
  
  <div class="gps-status" id="gpsStatus">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/>
      <line x1="12" y1="16" x2="12.01" y2="16"/>
    </svg>
    <span id="gpsStatusText">Activando GPS...</span>
  </div>
  <div class="toast" id="toast"><span id="toastText"></span></div>

  <div class="w-full max-w-[390px] bg-white rounded-[36px] p-2.5 shadow-2xl">
    <div class="relative w-full overflow-hidden rounded-[28px]" style="aspect-ratio: 9 / 16; max-height: 720px;">
      
      <!-- ============ SCREEN 4: EN RUTA (reproductor activo) ============ -->
      <section id="screen-player" class="screen active w-full h-full relative bg-touri-dark">
        <img id="player-bg" src="https://images.unsplash.com/photo-1518623489648-a173ef7824f3?w=780&q=80" class="absolute inset-0 w-full h-full object-cover opacity-55" alt="" />
        <div class="absolute inset-0" style="background:linear-gradient(to bottom, rgba(35,35,33,0.85) 0%, rgba(35,35,33,0.3) 40%, rgba(35,35,33,0.92) 100%);"></div>

        <button onclick="window.location.href='tour-detail.html'" class="absolute top-5 left-5 z-10 w-8 h-8 rounded-full bg-touri-cream/15 backdrop-blur-sm flex items-center justify-center text-touri-cream" aria-label="Volver al mapa">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div class="absolute top-5 right-5 flex items-center gap-2 z-10">
          <button onclick="showScreen('screen-route')" class="w-8 h-8 rounded-full bg-touri-cream/15 backdrop-blur-sm flex items-center justify-center text-touri-cream" aria-label="Ver recorrido completo">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z"/><path d="M9 3v15M15 6v15"/></svg>
          </button>
          <div class="flex items-center gap-1.5 bg-touri-blue text-touri-cream text-[11px] font-bold px-3 py-1.5 rounded-full">
            <span class="w-1.5 h-1.5 rounded-full bg-touri-yellow"></span> <span id="walkStopNum">PARADA 1 DE 17</span>
          </div>
        </div>

        <div class="absolute top-[180px] left-[22px] right-[22px] z-10">
          <p id="walkStopName" class="font-display text-[28px] uppercase text-touri-yellow leading-[1.1] m-0 mb-2">Buscando<br/>Ubicación...</p>
          <p id="nextStopName" class="text-[13px] text-touri-cream/75 m-0 mb-4">Próxima parada...</p>
          
          <button id="readMoreBtn" onclick="toggleInfoSheet()" class="bg-touri-cream/15 backdrop-blur-sm px-4 py-2.5 rounded-full text-touri-cream text-xs font-bold flex items-center gap-2 transition-transform active:scale-95 hidden">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
            Leer sobre el lugar
          </button>
        </div>

        <div id="info-sheet" class="absolute inset-0 bg-touri-dark z-50 transform translate-y-full transition-transform duration-300 flex flex-col">
          <div class="relative h-[240px] flex-shrink-0">
            <img id="info-photo" src="" class="w-full h-full object-cover" />
            <div class="absolute inset-0 bg-gradient-to-t from-touri-dark to-transparent"></div>
            <button onclick="toggleInfoSheet()" class="absolute top-5 right-5 w-8 h-8 rounded-full bg-touri-dark/50 flex items-center justify-center text-touri-cream backdrop-blur">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
            </button>
          </div>
          <div class="flex-1 overflow-y-auto px-6 pb-8 -mt-6 relative z-10">
            <h2 id="info-title" class="font-display text-2xl text-touri-yellow uppercase mb-3 leading-tight"></h2>
            <div id="info-text" class="text-[15px] text-touri-cream/85 leading-relaxed space-y-4"></div>
          </div>
        </div>

        <div class="absolute bottom-0 left-0 right-0 px-5 pb-7 pt-5 z-10">
          <div class="flex items-center gap-[2px] h-8 mb-4">
            <div class="w-[3px] h-[14px] bg-touri-green rounded"></div>
            <div class="w-[3px] h-[22px] bg-touri-green rounded"></div>
            <div class="w-[3px] h-[10px] bg-touri-green rounded"></div>
            <div class="w-[3px] h-[26px] bg-touri-green rounded"></div>
            <div class="w-[3px] h-[16px] bg-touri-green rounded"></div>
            <div class="w-[3px] h-[20px] bg-touri-cream/25 rounded"></div>
            <div class="w-[3px] h-[12px] bg-touri-cream/25 rounded"></div>
            <div class="w-[3px] h-[24px] bg-touri-cream/25 rounded"></div>
            <div class="w-[3px] h-[14px] bg-touri-cream/25 rounded"></div>
            <div class="w-[3px] h-[18px] bg-touri-cream/25 rounded"></div>
          </div>
          <div class="flex items-center justify-center gap-7">
            <button onclick="skipBack()">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" class="text-touri-cream"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
            </button>
            <button id="playBtn" onclick="togglePlay()" class="w-[60px] h-[60px] rounded-full bg-touri-green flex items-center justify-center text-touri-cream">
              <svg id="play-icon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                <path d="M8 5v14l11-7z"/> <!-- Default is paused -->
              </svg>
            </button>
            <button onclick="skipForward()">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" class="text-touri-cream"><path d="M16 6h2v12h-2zM6 6l8.5 6L6 18z"/></svg>
            </button>
          </div>
        </div>
      </section>

      <!-- ============ SCREEN 5: RECORRIDO COMPLETO ============ -->
      <section id="screen-route" class="screen flex-col w-full h-full bg-touri-dark">
        <div class="px-5 pt-6 pb-3.5 flex justify-between items-center z-10">
          <span class="font-display text-lg text-touri-cream">Recorrido completo</span>
          <button onclick="showScreen('screen-player')" class="w-7 h-7 rounded-full bg-touri-cream/12 flex items-center justify-center text-touri-cream text-sm" aria-label="Cerrar">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </button>
        </div>

        <div class="flex-1 relative" style="background:#1a1a18;">
          <div id="map" class="absolute inset-0 w-full h-full z-0"></div>
          
          <div class="absolute top-5 right-4 flex flex-col gap-1.5 z-10">
            <button onclick="map.zoomIn()" class="w-8 h-8 rounded-lg bg-touri-dark/85 flex items-center justify-center text-touri-cream text-base" aria-label="Acercar">+</button>
            <button onclick="map.zoomOut()" class="w-8 h-8 rounded-lg bg-touri-dark/85 flex items-center justify-center text-touri-cream text-base" aria-label="Alejar">–</button>
          </div>
          <div id="map-stop-tooltip" class="absolute text-touri-cream text-xs font-bold bg-touri-green px-3 py-1.5 rounded-full hidden z-10 transition-all"></div>
        </div>

        <div class="px-[18px] pt-4 pb-5 z-10" style="background:#2b2b28;">
          <div class="flex gap-3 mb-3.5">
            <div id="arrivedPhoto" class="w-[52px] h-[52px] rounded-xl bg-touri-cream/10 flex-shrink-0 bg-cover bg-center"></div>
            <div>
              <p id="arrivedStopNum" class="text-[11px] font-bold tracking-wide text-touri-yellow m-0 mb-0.5">CAPÍTULO 01</p>
              <p id="arrivedName" class="font-display text-lg text-touri-cream m-0">...</p>
            </div>
          </div>
          <div class="grid grid-cols-3 gap-2">
            <div class="bg-touri-cream/6 rounded-xl py-2.5 text-center">
              <p id="walkProgressPill" class="text-lg font-black text-touri-cream m-0">1/17</p>
              <p class="text-[10px] text-touri-cream/55 mt-0.5 m-0">Paradas</p>
            </div>
            <div class="bg-touri-cream/6 rounded-xl py-2.5 text-center">
              <p class="text-lg font-black text-touri-cream m-0"><span id="walkDist">...</span>m</p>
              <p class="text-[10px] text-touri-cream/55 mt-0.5 m-0">Próxima</p>
            </div>
            <div class="bg-touri-cream/6 rounded-xl py-2.5 text-center">
              <p class="text-lg font-black text-touri-cream m-0"><span id="tourRemain">...</span>'</p>
              <p class="text-[10px] text-touri-cream/55 mt-0.5 m-0">Restante</p>
            </div>
          </div>
        </div>
      </section>

    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="i18n.js"></script>
  <script src="tour-data.js"></script>
  <script src="audio.js"></script>
  <script src="gps.js"></script>
  <script src="player-logic.js"></script>
</body>
</html>
