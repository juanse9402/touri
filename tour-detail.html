<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Touri — Detalle</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="tailwind-config.js"></script>
  <style>
    /* Light theme map fixes */
    #preview-map { background: #E4D6BC; }
    .leaflet-control-attribution { display: none; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 bg-[#EDEDED]">
  <div class="w-full max-w-[390px] bg-white rounded-[36px] p-2.5 shadow-2xl">
    <div class="relative w-full overflow-hidden rounded-[28px]" style="aspect-ratio: 9 / 16; max-height: 720px;">
      
      <!-- ============ SCREEN 2: DETALLE DEL TOUR (hero) ============ -->
      <section id="screen-detail" class="screen active w-full h-full relative">
        <button onclick="window.location.href='index.html'" class="absolute top-5 left-5 z-10 w-8 h-8 rounded-full bg-touri-cream/20 backdrop-blur-sm flex items-center justify-center text-touri-cream" aria-label="Volver">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <img id="detail-bg" src="" class="absolute inset-0 w-full h-full object-cover" alt="" />
        <div class="absolute inset-0 bg-gradient-to-t from-touri-dark/95 via-touri-dark/40 to-touri-dark/10"></div>

        <div class="absolute inset-x-0 bottom-0 px-5 pb-7 pt-6">
          <span class="mb-3.5 inline-block rounded-full bg-touri-blue px-3 py-1.5 text-[11px] font-bold tracking-wide text-touri-cream">AL AIRE LIBRE</span>
          <h1 id="detail-title" class="mb-3 font-display text-[34px] font-black uppercase leading-[1.1] tracking-tight text-touri-cream">
            Cargando...
          </h1>
          <p id="detail-desc" class="mb-5 text-sm leading-relaxed text-touri-cream/85">Cargando detalles...</p>
          <button id="btn-start-route" onclick="showScreen('screen-map')" class="flex w-full items-center justify-center gap-2 rounded-2xl bg-touri-green py-4 text-[15px] font-bold text-touri-cream active:scale-[0.98] transition-transform">
            Empezar ruta gratis
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          </button>
          <div class="mt-3 flex justify-center gap-3 text-[11px] text-touri-cream/65">
            <span>Sin instalación</span><span>·</span><span>Funciona sin datos</span>
          </div>
        </div>
      </section>

      <!-- ============ SCREEN 3: MAPA ============ -->
      <section id="screen-map" class="screen flex-col w-full h-full bg-touri-cream">
        <div class="px-5 pt-6 pb-3 flex justify-between items-center z-10 relative">
          <button onclick="showScreen('screen-detail')" class="w-8 h-8 rounded-full bg-touri-dark/8 flex items-center justify-center text-touri-dark" aria-label="Volver">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <span id="map-stops-badge" class="text-xs font-bold text-touri-dark bg-touri-yellow px-2.5 py-1 rounded-full"></span>
        </div>

        <div class="flex-1 mx-4 rounded-[18px] overflow-hidden relative" style="background:#E4D6BC;">
          <div id="preview-map" class="absolute inset-0 w-full h-full"></div>
          <div class="absolute text-[10px] font-semibold bg-touri-dark text-touri-cream px-1.5 py-0.5 rounded pointer-events-none" style="top:50%;left:50%;transform:translate(-50%,-50%);z-index:999;">Estás aquí</div>
        </div>

        <div class="px-5 py-5 z-10 relative">
          <p id="map-title" class="font-display text-xl uppercase text-touri-dark m-0 mb-1"></p>
          <p id="map-desc" class="text-[13px] text-touri-dark/60 m-0 mb-4"></p>
          <button id="btn-confirm-route" onclick="startTour()" class="w-full rounded-2xl bg-touri-green text-touri-cream font-bold text-[15px] py-4">Confirmar y salir</button>
        </div>
      </section>

    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="i18n.js"></script>
  <script src="tour-data.js"></script>
  <script>
    let currentTourId = new URLSearchParams(window.location.search).get('id') || 'vitoria-casco-medieval';
    let map = null;

    document.addEventListener('DOMContentLoaded', async () => {
      const tour = await TourData.loadTour(currentTourId);
      if (!tour) return;
      const lang = typeof getLang === 'function' ? getLang() : 'es';
      const meta = tour.meta[lang] || tour.meta['es'];
      
      // Setup UI text
      const durationHours = Math.round(tour.stats.duration_min / 60);
      const distKm = tour.stats.distance_km ? tour.stats.distance_km.toFixed(1) : (tour.stats.distance_m ? (tour.stats.distance_m / 1000).toFixed(1) : '4.5');
      
      document.getElementById('detail-title').innerHTML = `${t('splash.headline.1')} <br/><span class="text-touri-yellow">${meta.name || meta.city}</span>`;
      document.getElementById('detail-desc').innerHTML = `${tour.stops.length} ${t('explore.stops')} · ${durationHours}h · ${distKm} km. ${t('detail.subtitle')}`;
      
      document.getElementById('map-stops-badge').textContent = `${tour.stops.length} ${t('explore.stops')}`;
      document.getElementById('map-title').textContent = meta.name || meta.city;
      document.getElementById('map-desc').textContent = `${distKm} km · ${tour.stops[0].name[lang]}`;
      
      // Update HTML static buttons
      document.getElementById('btn-start-route').innerHTML = `${t('start_btn')} <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>`;
      document.getElementById('btn-confirm-route').textContent = t('start_btn');
      
      // Try to load image
      let imgUrl = 'https://images.unsplash.com/photo-1558642084-fd07fae5282e?w=1200&q=80';
      if(tour.stops && tour.stops[0] && tour.stops[0].wiki_title) {
        const wikiImg = await TourData.fetchWikiImage(tour.stops[0].wiki_title);
        if(wikiImg) imgUrl = wikiImg;
      }
      document.getElementById('detail-bg').src = imgUrl;

      // Setup Map
      initMap(tour);
    });

    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
      if (screenId === 'screen-map' && map) {
        setTimeout(() => { map.invalidateSize(); }, 100);
      }
    }

    function startTour() {
      window.location.href = `tour-player.html?id=${currentTourId}`;
    }

    function initMap(tour) {
      map = L.map('preview-map', { zoomControl: false, dragging: false, scrollWheelZoom: false }).setView([42.846718, -2.671635], 16);
      
      L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
        attribution: '© OpenStreetMap © CARTO'
      }).addTo(map);

      const latlngs = tour.stops.map(s => [s.lat, s.lon]);
      
      const dotIcon = L.divIcon({
        html: `<div style="width:14px; height:14px; border-radius:50%; background:#94A35D;"></div>`,
        className: ''
      });
      
      tour.stops.forEach(s => {
        L.marker([s.lat, s.lon], { icon: dotIcon }).addTo(map);
      });
      
      L.polyline(latlngs, { color: '#94A35D', weight: 3, dashArray: '2, 8', opacity: 1, lineCap: 'round' }).addTo(map);
      
      if(latlngs.length > 0) {
        map.fitBounds(L.latLngBounds(latlngs), { padding: [20, 20] });
      }
    }
  </script>
</body>
</html>
